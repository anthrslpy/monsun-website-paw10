{% extends "base.html" %}

{% block title %}Login – Monsun Library{% endblock %}

{% block body %}
<body class="login-body">
    <div class="container">
        <div class="left-content" data-purpose="custom-background-target"></div>
        <div class="right-content">
            <div class="title">Welcome back!</div>
            <div class="subtitle">...or welcome, perhaps?</div>

            <form method="POST" action="{{ url_for('login') }}" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="form-group">
                    <label class="label" for="username">Username / Email</label>
                    <input class="input" id="username" name="username"
                            placeholder="Username or Email here" type="text" required />
                </div>
                <div class="form-group">
                    <label class="label" for="password">Password</label>
                    <input class="input" id="password" name="password"
                            placeholder="Your Password here" type="password" required />
                    <div class="forgot-password"><a href="#">Forgot password?</a></div>
                </div>
                <button class="login-btn" type="submit">Login</button>
                <div class="footer-text">
                    Don't have an account?
                    <a href="{{ url_for('register') }}">Sign Up instead</a>
                </div>
            </form>
        </div>
    </div>
</body>
{% endblock %}
