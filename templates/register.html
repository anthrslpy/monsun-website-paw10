{% extends "base.html" %}

{% block title %}Register – Monsun Library{% endblock %}

{% block body %}
<body class="login-body">
    <div class="container">
        <div class="left-content" data-purpose="custom-background-target"></div>
        <div class="right-content" style="overflow-y: auto; padding: 220px 80px 80px;">
            <div class="title">Welcome!</div>
            <div class="subtitle">Start reading and writing with us.</div>

            <form method="POST" action="{{ url_for('register') }}" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="form-group">
                    <label class="label" for="full_name">Full Name</label>
                    <input class="input" id="full_name" name="full_name"
                           placeholder="Your full name here" type="text"
                           value="{{ request.form.full_name or '' }}" required />
                </div>
                <div class="form-group">
                    <label class="label" for="email">Email</label>
                    <input class="input" id="email" name="email"
                           placeholder="email@example.com" type="email"
                           value="{{ request.form.email or '' }}" required />
                </div>
                <div class="form-group">
                    <label class="label" for="username">Username</label>
                    <input class="input" id="username" name="username"
                           placeholder="Unique name here" type="text"
                           value="{{ request.form.username or '' }}" required />
                    <div class="forgot-password" style="text-align: left; padding-left: 16px;">
                        <small style="color: var(--blue-medium); font-size: 16px;">
                            This will be your display name on Monsun
                        </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="label" for="password">Password</label>
                    <input class="input" id="password" name="password"
                           placeholder="Minimum 8 characters" type="password" required />
                </div>
                <div class="form-group">
                    <label class="label" for="confirm_password">Confirm Password</label>
                    <input class="input" id="confirm_password" name="confirm_password"
                           placeholder="Re-enter password" type="password" required />
                </div>
                <button class="login-btn" type="submit">Register</button>
                <div class="footer-text">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Login here</a>
                </div>
            </form>
        </div>
    </div>
</body>
{% endblock %}
